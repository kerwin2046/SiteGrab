[package]
name = "sitegrab"
version = "0.5.3"
edition = "2021"
description = "Simple website mirroring tool — download, convert links, zip export"
license = "MIT"
repository = "https://github.com/kerwin2046/SiteGrab"

[features]
# SPA rendering (Vue/React/Angular) via headless browser is enabled by default.
# It is needed for auto-detecting and crawling JavaScript-rendered sites.
# Requires Chrome/Chromium installed at runtime.
default = ["render"]
render = ["dep:chromiumoxide", "dep:futures"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.27"
url = "2"
indicatif = "0.18"
zip = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
encoding_rs = "0.8"

# Optional: headless browser for SPA rendering
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
